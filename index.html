<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.coingecko.com https://site.api.espn.com https://gamma-api.polymarket.com https://en.wikipedia.org https://hacker-news.firebaseio.com https://api.github.com https://gist.githubusercontent.com; frame-src 'self' https: blob: data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script src="js/guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ulyOS">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>ulyOS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Boot sequence -->
  <div id="boot" aria-live="polite" hidden>
    <div class="boot-core">
      <svg class="boot-logo" viewBox="0 0 80 80" width="76" height="76" aria-hidden="true">
        <circle class="ring" cx="40" cy="40" r="28" />
        <circle class="dot" cx="40" cy="40" r="5" />
      </svg>
      <div class="boot-word">uly<span>OS</span></div>
      <div id="boot-bar" class="boot-bar"><i></i></div>
      <div id="boot-log" class="boot-log mono"></div>
      <div class="boot-hint">press any key to skip</div>
    </div>
  </div>

  <div id="wallpaper" class="wp-void"></div>
  <div id="fx-aurora" aria-hidden="true"></div>

  <!-- Profile picker / sign-in / lock screen (js/security.js) -->
  <div id="auth" aria-live="polite"></div>

  <main id="desktop" aria-label="Desktop"></main>
  <div id="cell-hint"></div>

  <div id="windows"></div>
  <div id="snap-preview"></div>
  <div id="drag-shield"></div>

  <!-- macOS-style menu bar (optional, js/shell.js) -->
  <header id="menubar" aria-label="Menu bar"><div class="mb-left" id="mb-left"></div><div class="mb-right" id="mb-right"></div></header>
  <div id="tray-float"></div>
  <div id="tb-hot"></div>

  <!-- Taskbar / dock -->
  <nav id="taskbar" aria-label="Taskbar" data-mode="bar" data-pos="bottom">
    <button id="tb-start" class="tb-start" aria-label="Start menu" aria-haspopup="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg>
    </button>
    <button id="tb-widgets" class="tb-start tb-widgets" aria-label="Widgets" title="Widgets"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
    <div id="tb-tasks" class="tb-tasks"></div>
    <div id="tb-tray" class="tb-tray">
      <button id="tray-ram" class="tray-ram" title="Open Task Manager">
        <span class="lbl">RAM</span><span class="v mono">— MB</span><span class="meter"><i></i></span>
      </button>
      <button id="tray-user" class="tray-user" aria-label="Profile menu"></button>
      <div id="tray-clock" class="tray-clock"></div>
    </div>
    <button id="tb-desk" class="tb-desk" title="Show desktop" aria-label="Show desktop"></button>
  </nav>

  <!-- Start menu -->
  <div id="start-menu" hidden>
    <div class="sm-search"><input id="sm-search" class="input" type="search" placeholder="Search apps…" autocomplete="off" spellcheck="false"></div>
    <div id="sm-list" class="sm-list"></div>
    <div class="sm-foot">
      <button id="sm-lock" class="btn sm">Lock</button>
      <button id="sm-contact" class="btn sm" hidden>✉ Contact Admin</button>
      <button id="sm-offline" class="btn sm" hidden>⬇ Offline version</button>
      <button id="sm-fullscreen" class="btn sm">Fullscreen</button>
      <button id="sm-restart" class="btn sm danger">Restart</button>
    </div>
  </div>

  <div id="overlay-root"></div>
  <div id="cursor-ring" class="hidden"></div>

  <noscript><p style="color:#fff;padding:2rem">ulyOS needs JavaScript.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/version.js"></script>
  <script src="js/window.js"></script>
  <script src="js/security.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/telemetry.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/landscapes.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
